; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
extra_scripts = pre:scripts/embed_debug_config.py

; Serial monitor
monitor_speed = 115200
monitor_filters = colorize, time

; Fail fast on sketchy code, and make include/config.h visible to lib/ modules
build_flags = -Wall -Wextra -Iinclude

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    pololu/VL53L0X@1.3.1
    pololu/VL53L1X@1.3.1
    sparkfun/SX1509 IO Expander@3.0.6
